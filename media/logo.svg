<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1f3a2c"/>
      <stop offset="1" stop-color="#08120d"/>
    </radialGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.35" stop-color="#f0c25a"/>
      <stop offset="0.7" stop-color="#b07a22"/>
      <stop offset="1" stop-color="#e9b84e"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c6a1c"/>
      <stop offset="0.45" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#a87420"/>
    </linearGradient>
    <radialGradient id="medal" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#22324a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b646e"/>
      <stop offset="0.18" stop-color="#b9c3cc"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#d7dee4"/>
      <stop offset="0.82" stop-color="#8c96a0"/>
      <stop offset="1" stop-color="#454c54"/>
    </linearGradient>
    <linearGradient id="fuller" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7781"/>
      <stop offset="0.5" stop-color="#c7d0d8"/>
      <stop offset="1" stop-color="#58616a"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b170b"/>
      <stop offset="0.5" stop-color="#6e4122"/>
      <stop offset="1" stop-color="#24130a"/>
    </linearGradient>
    <radialGradient id="ruby" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffb3b3"/>
      <stop offset="0.35" stop-color="#e0283a"/>
      <stop offset="1" stop-color="#5c0610"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d23a33"/>
      <stop offset="0.55" stop-color="#9e1c1c"/>
      <stop offset="1" stop-color="#6a0f12"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1d1d"/>
      <stop offset="1" stop-color="#4a0a0d"/>
    </linearGradient>
    <clipPath id="gripClip"><rect x="-9" y="96" width="18" height="62" rx="4"/></clipPath>

    <!-- Épée verticale, pointe en haut, centre de la garde en (0,90) -->
    <g id="sword">
      <!-- lame -->
      <path d="M0 -210 L15 -178 L17 80 L-17 80 L-15 -178 Z" fill="url(#steel)" stroke="#2c3138" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- gouttière -->
      <path d="M-3.5 -160 L3.5 -160 L4 70 L-4 70 Z" fill="url(#fuller)" opacity="0.9"/>
      <!-- reflet du fil -->
      <path d="M0 -206 L13 -178 L14.5 78" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- talon -->
      <rect x="-19" y="74" width="38" height="12" rx="3" fill="url(#goldH)" stroke="#4a3210" stroke-width="2"/>
      <!-- garde aux quillons recourbés -->
      <path d="M-58 84 C-50 92 -30 95 -14 93 L14 93 C30 95 50 92 58 84 C63 89 62 99 55 102 C42 107 26 105 14 104 L-14 104 C-26 105 -42 107 -55 102 C-62 99 -63 89 -58 84 Z"
            fill="url(#goldV)" stroke="#4a3210" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-60" cy="85" r="6.5" fill="url(#goldV)" stroke="#4a3210" stroke-width="2"/>
      <circle cx="60" cy="85" r="6.5" fill="url(#goldV)" stroke="#4a3210" stroke-width="2"/>
      <!-- écusson et rubis -->
      <path d="M0 84 L14 98 L0 112 L-14 98 Z" fill="url(#goldV)" stroke="#4a3210" stroke-width="2"/>
      <circle cx="0" cy="98" r="6.5" fill="url(#ruby)" stroke="#3a0408" stroke-width="1.2"/>
      <!-- poignée en cuir tressé -->
      <rect x="-9" y="104" width="18" height="56" rx="4" fill="url(#leather)" stroke="#1a0d05" stroke-width="2"/>
      <g clip-path="url(#gripClip)" stroke="#1a0d05" stroke-width="2.2" stroke-opacity="0.85">
        <line x1="-12" y1="106" x2="12" y2="116"/><line x1="-12" y1="116" x2="12" y2="126"/>
        <line x1="-12" y1="126" x2="12" y2="136"/><line x1="-12" y1="136" x2="12" y2="146"/>
        <line x1="-12" y1="146" x2="12" y2="156"/><line x1="-12" y1="156" x2="12" y2="166"/>
      </g>
      <!-- pommeau -->
      <rect x="-11" y="158" width="22" height="8" rx="3" fill="url(#goldH)" stroke="#4a3210" stroke-width="2"/>
      <circle cx="0" cy="178" r="14" fill="url(#goldV)" stroke="#4a3210" stroke-width="2.5"/>
      <circle cx="0" cy="178" r="6" fill="url(#ruby)" stroke="#3a0408" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- fond et cadre doré -->
  <rect x="4" y="4" width="504" height="504" rx="70" fill="#1a1206"/>
  <rect x="12" y="12" width="488" height="488" rx="64" fill="url(#goldV)"/>
  <rect x="22" y="22" width="468" height="468" rx="56" fill="#3a2a10"/>
  <rect x="26" y="26" width="460" height="460" rx="52" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="42" fill="none" stroke="#d9a640" stroke-opacity="0.35" stroke-width="2"/>
  <!-- losanges d'angle -->
  <g fill="url(#goldV)" stroke="#4a3210" stroke-width="1.5">
    <path d="M60 52 L68 60 L60 68 L52 60 Z"/><path d="M452 52 L460 60 L452 68 L444 60 Z"/>
    <path d="M60 444 L68 452 L60 460 L52 452 Z"/><path d="M452 444 L460 452 L452 460 L444 452 Z"/>
  </g>

  <!-- médaillon -->
  <circle cx="256" cy="226" r="150" fill="#1a1206"/>
  <circle cx="256" cy="226" r="146" fill="url(#goldV)"/>
  <circle cx="256" cy="226" r="134" fill="#3a2a10"/>
  <circle cx="256" cy="226" r="131" fill="url(#medal)"/>
  <circle cx="256" cy="226" r="118" fill="none" stroke="#d9a640" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 7"/>
  <g fill="url(#goldV)" stroke="#4a3210" stroke-width="1">
    <circle cx="256" cy="86" r="5"/><circle cx="256" cy="366" r="5"/>
    <circle cx="116" cy="226" r="5"/><circle cx="396" cy="226" r="5"/>
  </g>

  <!-- épées croisées -->
  <g filter="drop-shadow(0 4px 4px rgba(0,0,0,0.6))">
    <use xlink:href="#sword" transform="translate(256 204) rotate(-36) scale(0.78) translate(0 22)"/>
    <use xlink:href="#sword" transform="translate(256 204) rotate(36) scale(0.78) translate(0 22)"/>
  </g>

  <!-- ruban -->
  <path d="M40 392 L96 392 L96 448 L40 448 L58 420 Z" fill="url(#ribbonDark)" stroke="#2a0406" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M472 392 L416 392 L416 448 L472 448 L454 420 Z" fill="url(#ribbonDark)" stroke="#2a0406" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M82 380 L430 380 L430 440 L82 440 Z" fill="url(#ribbon)" stroke="#2a0406" stroke-width="3"/>
  <path d="M82 440 L96 448 L96 440 Z M430 440 L416 448 L416 440 Z" fill="#3a0608"/>
  <line x1="90" y1="387" x2="422" y2="387" stroke="#f5c15a" stroke-opacity="0.7" stroke-width="2"/>
  <line x1="90" y1="433" x2="422" y2="433" stroke="#f5c15a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="256" y="422" text-anchor="middle" font-family="Liberation Serif" font-weight="bold" font-size="38" letter-spacing="1.5"
        fill="url(#goldV)" stroke="#2a0406" stroke-width="2.5" paint-order="stroke">FRÈRES D'ÉPÉE</text>
</svg>
